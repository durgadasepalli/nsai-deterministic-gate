plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.3.0'
    id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.durgaprasad'
version = '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Add this line to pull in Neo4j repositories
    implementation 'org.springframework.boot:spring-boot-starter-data-neo4j'

    // v1.3 Latency Optimization: L1 Caching
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'

}

springBoot {
    mainClass = 'com.durgaprasad.nsai.NSAIDeterministcApplication'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')

    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
        // Stream stdout so the cache benchmark trace is visible
        showStandardStreams = true
    }
}

jacoco {
    toolVersion = '0.8.12'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        csv.required = true
        html.required = true
    }
}
